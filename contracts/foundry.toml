[profile.default]
src      = "src"
out      = "out"
libs     = ["lib"]
test     = "test"
script   = "script"
solc     = "0.8.24"

optimizer        = true
optimizer_runs   = 200
via_ir           = false

remappings = [
    "solady/=lib/solady/src/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1000

[profile.ci]
fuzz = { runs = 5000 }

[rpc_endpoints]
mainnet = "${ETH_RPC}"
sepolia = "${SEPOLIA_RPC}"
anvil   = "http://127.0.0.1:8545"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
